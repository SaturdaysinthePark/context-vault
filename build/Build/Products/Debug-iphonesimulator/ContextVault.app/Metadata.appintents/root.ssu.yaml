apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.saturdaysinthepark.contextvault
    intents:
    - metadata:
        name: AskVaultIntent_0
        title: Ask Context Vault
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Ask ${+applicationName}'
          - '{${+prefix} }Ask my vault in ${+applicationName}'
          - '{${+prefix} }Ask ${+applicationName} about my notes'
    - metadata:
        name: CaptureMemoryIntent_1
        title: Capture Memory
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Capture a memory in ${+applicationName}'
          - '{${+prefix} }Remember this in ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - ContextVault
- name: CollectionEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Collection
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
