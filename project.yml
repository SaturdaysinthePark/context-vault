# XcodeGen project spec — run `xcodegen generate` (brew install xcodegen) to produce ContextVault.xcodeproj
name: ContextVault
options:
  bundleIdPrefix: com.saturdaysinthepark
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 language mode for now — the scaffold hasn't been audited for
    # Swift 6 strict concurrency; flip to 6.0 once warnings are cleaned up.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  ContextVault:
    type: application
    platform: iOS
    sources: [ContextVault]
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saturdaysinthepark.contextvault
    info:
      path: ContextVault/Info.plist
      properties:
        UILaunchScreen: {}
        NSSiriUsageDescription: "Context Vault lets Siri answer questions using your memories and collections."
        BGTaskSchedulerPermittedIdentifiers:
          - com.saturdaysinthepark.contextvault.sync
        UIBackgroundModes:
          - processing
        CoreSpotlightContinuation: true
  ContextVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ContextVaultTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ContextVault
